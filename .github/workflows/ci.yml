name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: moonbitlang/setup-moon@v1
        with:
          version: latest

      - name: Check
        run: moon check

      - name: Test
        run: moon test

      - name: Format check
        run: moon fmt --check
